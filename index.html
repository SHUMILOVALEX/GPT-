<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142e2a">
  <title>Точка анализа — маршрут в профессию</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">К содержимому</a>
  <aside class="sidebar">
    <a class="brand" href="#home"><span class="brand-icon">т.</span><span>точка анализа<small>ОТ ВОПРОСА К СИСТЕМЕ</small></span></a>
    <div class="sidebar-label">ТВОЁ ОБУЧЕНИЕ</div>
    <nav aria-label="Основная навигация">
      <a href="#home" data-nav="home"><span>◫</span> Мой маршрут</a>
      <a href="#review" data-nav="review"><span>▤</span> Карточки <b id="due-count">0</b></a>
      <a href="#portfolio" data-nav="portfolio"><span>◇</span> Мой проект</a>
      <a href="#library" data-nav="library"><span>▥</span> Библиотека</a>
    </nav>
    <div class="sidebar-label">12 НЕДЕЛЬ · ДВЕ ПРОФЕССИИ</div>
    <nav id="module-nav" class="module-nav" aria-label="Блоки курса"></nav>
    <div class="sidebar-foot"><span class="status-dot"></span>Твоя работа сохраняется в браузере<button id="export" class="text-button">↓ Экспортировать прогресс</button><label class="text-button import-label">↑ Восстановить из файла<input id="import" type="file" accept="application/json,.json"></label></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><span>Личная образовательная платформа</span><div><span class="local-badge">● Локальный прогресс</span><button id="search-button" aria-label="Поиск по курсу">⌕ <span>Поиск</span><kbd>/</kbd></button></div></header>
    <main id="main" tabindex="-1"></main>
    <footer>Понимать → применять → объяснять. По одному решению за раз.</footer>
  </div>
  <dialog id="search-dialog"><form method="dialog"><button class="close" aria-label="Закрыть поиск">×</button></form><label for="search-input">Найти тему, термин или блок</label><input id="search-input" type="search" placeholder="Например, идемпотентность…"><div id="search-results"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
